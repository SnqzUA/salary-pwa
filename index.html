<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розрахунок ЗП</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --primary: #007aff;
            --accent: #34c759;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            display: none; /* Скрываем весь интерфейс до авторизации */
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .total-box {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
            text-align: center;
        }
        .total-box h3 { margin: 0; font-size: 16px; opacity: 0.9; }
        .total-amount { font-size: 32px; font-weight: bold; margin-top: 5px; }
        
        h2 { margin-top: 0; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active { opacity: 0.9; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .history-item:last-child { border-bottom: none; }
        .amount-tag { font-weight: bold; color: #222; text-align: right; }
        .details { color: #666; font-size: 13px; margin-top: 2px; }
        .date { color: #999; font-size: 11px; margin-top: 2px; }
        .clear-btn {
            background: none;
            color: #ff3b30;
            border: none;
            padding: 5px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
            text-align: right;
            margin-top: 10px;
            font-weight: normal;
        }

        /* ЭКРАН БЛОКИРОВКИ */
        .lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .lock-card {
            width: 90%;
            max-width: 360px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }
        .lock-card h2 { margin-bottom: 20px; font-size: 22px; color: #222; }
        .lock-card input {
            text-align: center;
            letter-spacing: 4px;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .lock-card button { background-color: var(--primary); margin-top: 0; }
        .error-msg { color: #ff3b30; font-size: 14px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<!-- Экран ввода пароля -->
<div id="lockScreen" class="lock-screen">
    <div class="lock-card">
        <h2>Доступ обмежено</h2>
        <input type="password" id="passwordInput" placeholder="••••" inputmode="numeric">
        <button id="loginBtn">Увійти</button>
        <div id="errorMsg" class="error-msg">Невірний пароль!</div>
    </div>
</div>

<!-- Основной интерфейс приложения -->
<div class="container" id="mainContainer">
    <div class="card total-box">
        <h3>Зароблено всього:</h3>
        <div class="total-amount" id="totalSalary">0.00 грн</div>
    </div>

    <div class="card">
        <h2>Додати виконану роботу</h2>
        <form id="salaryForm">
            <div class="form-group">
                <label for="jobName">Назва роботи</label>
                <input type="text" id="jobName" placeholder="Наприклад: Обробка деталей" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Кількість (шт)</label>
                    <input type="number" id="quantity" min="1" placeholder="0" required inputmode="numeric">
                </div>

                <div class="form-group">
                    <label for="price">Ціна за 1 шт (грн)</label>
                    <input type="number" id="price" step="0.01" placeholder="0.00" required inputmode="decimal">
                </div>
            </div>

            <button type="submit">Додати в баланс</button>
        </form>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Історія виробітку</h2>
            <button id="clearAll" class="clear-btn">Очистити все</button>
        </div>
        <ul id="history" class="history-list"></ul>
    </div>
</div>

<script>
    // === ТВОЙ ПАРОЛЬ ТУТ ===
    const SECRET_PASSWORD = '19122019'; 

    const form = document.getElementById('salaryForm');
    const historyContainer = document.getElementById('history');
    const totalSalaryContainer = document.getElementById('totalSalary');
    const clearBtn = document.getElementById('clearAll');
    
    const lockScreen = document.getElementById('lockScreen');
    const mainContainer = document.getElementById('mainContainer');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    let workLog = JSON.parse(localStorage.getItem('salary_work_log_v2')) || [];

    // Проверка авторизации при старте
    function checkAuth() {
        const authTime = localStorage.getItem('salary_auth_time');
        const now = new Date().getTime();

        // Если с момента последнего ввода прошло меньше 30 минут (1800000 мс)
        if (authTime && (now - authTime < 1800000)) {
            unlockApp();
        } else {
            lockApp();
        }
    }

    function lockApp() {
        lockScreen.style.display = 'flex';
        mainContainer.style.display = 'none';
        passwordInput.value = '';
        errorMsg.style.display = 'none';
    }

    function unlockApp() {
        lockScreen.style.display = 'none';
        mainContainer.style.display = 'block';
        localStorage.setItem('salary_auth_time', new Date().getTime());
        updateDashboard();
    }

    // Обработка кнопки "Увійти"
    function handleLogin() {
        if (passwordInput.value === SECRET_PASSWORD) {
            unlockApp();
        } else {
            errorMsg.style.display = 'block';
            passwordInput.value = '';
        }
    }

    loginBtn.addEventListener('click', handleLogin);
    passwordInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });

    function updateDashboard() {
        const total = workLog.reduce((sum, item) => sum + (parseInt(item.quantity) * parseFloat(item.price)), 0);
        totalSalaryContainer.innerText = `${total.toFixed(2)} грн`;

        historyContainer.innerHTML = '';
        if (workLog.length === 0) {
            historyContainer.innerHTML = '<li style="color:#888; text-align:center; padding: 10px 0;">Немає записів</li>';
            return;
        }

        workLog.forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            const itemTotal = parseInt(item.quantity) * parseFloat(item.price);
            
            li.innerHTML = `
                <div>
                    <strong>${item.jobName}</strong>
                    <div class="details">${item.quantity} шт × ${parseFloat(item.price).toFixed(2)} грн</div>
                    <div class="date">${item.date}</div>
                </div>
                <div class="amount-tag">+${itemTotal.toFixed(2)} грн</div>
            `;
            historyContainer.appendChild(li);
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const jobName = document.getElementById('jobName').value;
        const quantity = document.getElementById('quantity').value;
        const price = document.getElementById('price').value;
        
        const now = new Date();
        const dateStr = now.toLocaleDateString('uk-UA') + ' ' + now.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'});

        const newRecord = { jobName, quantity, price, date: dateStr };
        
        workLog.unshift(newRecord);
        localStorage.setItem('salary_work_log_v2', JSON.stringify(workLog));
        
        updateDashboard();
        form.reset();
    });

    clearBtn.addEventListener('click', function() {
        if (confirm('Ви впевнені, що хочете видалити всі записи?')) {
workLog = [];
localStorage.removeItem('salary_work_log_v2');
updateDashboard();
}
});
// Запуск проверки
checkAuth();
