<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Розрахунок ЗП</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333;
            --primary: #007aff;
            --accent: #34c759;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .total-box {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white;
            text-align: center;
        }
        .total-box h3 { margin: 0; font-size: 16px; opacity: 0.9; }
        .total-amount { font-size: 32px; font-weight: bold; margin-top: 5px; }
        
        h2 { margin-top: 0; font-size: 18px; }
        .form-group { margin-bottom: 15px; }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .form-row {
            display: flex;
            gap: 10px;
        }
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active { opacity: 0.9; }
        .history-list { list-style: none; padding: 0; margin: 0; }
        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .history-item:last-child { border-bottom: none; }
        .amount-tag { font-weight: bold; color: #222; text-align: right; }
        .details { color: #666; font-size: 13px; margin-top: 2px; }
        .date { color: #999; font-size: 11px; margin-top: 2px; }
        .clear-btn {
            background: none;
            color: #ff3b30;
            border: none;
            padding: 5px;
            font-size: 12px;
            cursor: pointer;
            width: auto;
            text-align: right;
            margin-top: 10px;
            font-weight: normal;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card total-box">
        <h3>Зароблено всього:</h3>
        <div class="total-amount" id="totalSalary">0.00 грн</div>
    </div>

    <div class="card">
        <h2>Додати виконану роботу</h2>
        <form id="salaryForm">
            <div class="form-group">
                <label for="jobName">Назва роботи</label>
                <input type="text" id="jobName" placeholder="Наприклад: Обробка деталей, Упаковка" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="quantity">Кількість (шт)</label>
                    <input type="number" id="quantity" min="1" placeholder="0" required inputmode="numeric">
                </div>

                <div class="form-group">
                    <label for="price">Ціна за 1 шт (грн)</label>
                    <input type="number" id="price" step="0.01" placeholder="0.00" required inputmode="decimal">
                </div>
            </div>

            <button type="submit">Додати в баланс</button>
        </form>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Історія виробітку</h2>
            <button id="clearAll" class="clear-btn">Очистити все</button>
        </div>
        <ul id="history" class="history-list"></ul>
    </div>
</div>

<script>
    // === ТВОЙ ПАРОЛЬ ТУТ ===
    // Замени '1234' на любой свой секретный пароль (оставь в кавычках)
    const SECRET_PASSWORD = '19122019'; 

    const form = document.getElementById('salaryForm');
    const historyContainer = document.getElementById('history');
    const totalSalaryContainer = document.getElementById('totalSalary');
    const clearBtn = document.getElementById('clearAll');

    let workLog = JSON.parse(localStorage.getItem('salary_work_log_v2')) || [];

    function updateDashboard() {
        const total = workLog.reduce((sum, item) => sum + (parseInt(item.quantity) * parseFloat(item.price)), 0);
        totalSalaryContainer.innerText = `${total.toFixed(2)} грн`;

        historyContainer.innerHTML = '';
        if (workLog.length === 0) {
            historyContainer.innerHTML = '<li style="color:#888; text-align:center; padding: 10px 0;">Немає записів</li>';
            return;
        }

        workLog.forEach(item => {
            const li = document.createElement('li');
            li.className = 'history-item';
            const itemTotal = parseInt(item.quantity) * parseFloat(item.price);
            
            li.innerHTML = `
                <div>
                    <strong>${item.jobName}</strong>
                    <div class="details">${item.quantity} шт × ${parseFloat(item.price).toFixed(2)} грн</div>
                    <div class="date">${item.date}</div>
                </div>
                <div class="amount-tag">+${itemTotal.toFixed(2)} грн</div>
            `;
            historyContainer.appendChild(li);
        });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        // Проверка пароля перед добавлением
        const pass = prompt('Введіть пароль для підтвердження операції:');
        if (pass !== SECRET_PASSWORD) {
            alert('Невірний пароль! Доступ заблоковано.');
            return;
        }
        
        const jobName = document.getElementById('jobName').value;
        const quantity = document.getElementById('quantity').value;
        const price = document.getElementById('price').value;
        
        const now = new Date();
        const dateStr = now.toLocaleDateString('uk-UA') + ' ' + now.toLocaleTimeString('uk-UA', {hour: '2-digit', minute:'2-digit'});

        const newRecord = { jobName, quantity, price, date: dateStr };
        
        workLog.unshift(newRecord);
        localStorage.setItem('salary_work_log_v2', JSON.stringify(workLog));
        
        updateDashboard();
        form.reset();
    });

    clearBtn.addEventListener('click', function() {
        // Проверка пароля перед очисткой всей истории
        const pass = prompt('Введіть пароль для очищення всієї історії:');
        if (pass !== SECRET_PASSWORD) {
            alert('Невірний пароль! Очищення скасовано.');
            return;
        }

        if (confirm('Ви впевнені, що хочете видалити всі записи?')) {
            workLog = [];
            localStorage.removeItem('salary_work_log_v2');
            updateDashboard();
        }
    });

    updateDashboard();
</script>
</body>
</html>
